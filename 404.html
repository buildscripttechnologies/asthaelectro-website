<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Astha Electronics Solution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .error-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        gap: 1.5rem;
      }
      .error-code {
        font-size: clamp(6rem, 20vw, 12rem);
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.04em;
      }
      .error-title {
        font-size: clamp(1.2rem, 3vw, 2rem);
        font-weight: 700;
        color: var(--text);
      }
      .error-sub {
        color: var(--muted);
        max-width: 420px;
        line-height: 1.7;
      }
      .error-trace {
        font-family: 'Courier New', monospace;
        font-size: 0.78rem;
        color: var(--primary);
        opacity: 0.6;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main class="error-page">
      <p class="error-trace">// ERROR 0x404 — NET NOT FOUND</p>
      <div class="error-code">404</div>
      <h1 class="error-title">Trace Break Detected</h1>
      <p class="error-sub">
        The page you're looking for has gone open-circuit. Check the URL or
        route back to the main board.
      </p>
      <a href="/" class="btn btn-primary" style="margin-top:0.5rem;">Back to Home</a>
    </main>
  </body>
</html>
